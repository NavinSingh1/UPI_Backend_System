worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/json;

  # ---- Logging: include the upstream that served the request and how long it
  # took, so you can actually see load balancing and per-instance latency ----
  log_format upstream_log '$remote_addr - [$time_local] "$request" '
                          'status=$status bytes=$body_bytes_sent '
                          'upstream=$upstream_addr upstream_status=$upstream_status '
                          'rt=$request_time urt=$upstream_response_time '
                          'req_id=$http_x_request_id';

  access_log /var/log/nginx/access.log upstream_log;
  error_log  /var/log/nginx/error.log warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  server_tokens off;   # don't advertise the nginx version

  keepalive_timeout 65;
  client_max_body_size 2m;   # this is a JSON API; nothing legitimate is bigger

  gzip on;
  gzip_types application/json application/javascript text/plain text/css application/xml;
  gzip_min_length 512;
  gzip_proxied any;

  # ---- LOAD BALANCER ----
  # least_conn beats round-robin here because request cost is uneven: a PDF
  # statement or an analytics aggregation takes far longer than a balance
  # read, and round-robin would keep feeding work to an instance that's
  # already busy with a slow one.
  #
  # max_fails/fail_timeout are nginx's PASSIVE health checking: after 3
  # failed attempts an instance is taken out of rotation for 15s, then
  # retried. (Active health checks against /health are an nginx Plus
  # feature; passive checking is the open-source equivalent.)
  upstream phonepe_api {
    least_conn;

    server api-1:5000 max_fails=3 fail_timeout=15s;
    server api-2:5000 max_fails=3 fail_timeout=15s;
    server api-3:5000 max_fails=3 fail_timeout=15s;

    # Reuse upstream connections instead of reconnecting per request
    keepalive 32;
  }

  # ---- Edge rate limiting ----
  # A cheap first line of defence in front of the app's own limiters: this
  # sheds floods before they ever cost a Node process a single cycle.
  # The app's per-route limiters stay in place for the fine-grained rules.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;
  limit_conn_status 429;

  server {
    listen 80;
    server_name _;

    # ---- REVERSE PROXY ----
    location / {
      limit_req zone=api_limit burst=60 nodelay;
      limit_conn api_conn 20;

      proxy_pass http://phonepe_api;
      proxy_http_version 1.1;

      # Forward the real client identity. The app sets `trust proxy` to 1 hop
      # so its rate limiters bucket by the true client IP rather than by
      # nginx's address (which would throttle every user as one).
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;

      # Preserve the caller's correlation id, or mint one so a request can be
      # traced end to end even if the client didn't send one.
      proxy_set_header X-Request-Id      $http_x_request_id;

      proxy_set_header Connection        "";

      proxy_connect_timeout 5s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;

      # Retry the next upstream when one instance is down or erroring.
      # non_idempotent is deliberately EXCLUDED: retrying a failed POST
      # /transactions/send could double-charge. Money endpoints are protected
      # by Idempotency-Key at the app layer, but the proxy should not be the
      # thing deciding to replay a payment.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    # nginx's own liveness endpoint — answers without touching the upstreams
    location = /nginx-health {
      access_log off;
      return 200 '{"status":"ok","proxy":"nginx"}';
    }

    # Streamed PDF statements shouldn't be buffered to disk by the proxy
    location /api/transactions/statement {
      proxy_pass http://phonepe_api;
      proxy_http_version 1.1;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id    $http_x_request_id;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
  }
}
