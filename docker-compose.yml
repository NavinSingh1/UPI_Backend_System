# One command to get the whole stack: `docker compose up`
#
#   client -> nginx (reverse proxy + load balancer)
#               -> api-1 / api-2 / api-3   (stateless, no background jobs)
#          worker (notification queue consumer + autopay cron)
#          mongo (single-node replica set, so transactions work)
#          redis (cache, rate-limit counters, blacklist, idempotency, queue)
#
# Only nginx publishes a port. The API replicas are reachable only from
# inside the compose network, which is the point of a reverse proxy.

x-api-env: &api-env
  PORT: 5000
  MONGODB_URI: mongodb://mongo:27017/phonepe-clone?replicaSet=rs0&directConnection=true
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
  NODE_ENV: ${NODE_ENV:-development}
  MONGO_TRANSACTIONS: auto
  # Behind exactly one proxy (nginx). Do NOT set this to a larger number or
  # to `true` — that would let clients spoof X-Forwarded-For and pick their
  # own rate-limit bucket.
  TRUST_PROXY_HOPS: 1
  # Background work lives in the `worker` service, not in the API replicas.
  # Without this, three replicas would mean three autopay schedulers.
  DISABLE_WORKER: 'true'
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-PhonePe Clone <no-reply@phonepeclone.com>}

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: phonepe-nginx
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_started
      api-2:
        condition: service_started
      api-3:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost/nginx-health']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api-1:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-2:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-3:
    build: .
    environment:
      <<: *api-env
      INSTANCE_ID: api-3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Single worker: owns the notification queue consumer and the autopay cron.
  # Deliberately NOT scaled — the recurring scheduler assumes one ticker.
  # (The partial unique index on reference.periodKey would still prevent a
  # double-charge if this were scaled, but one instance is the design.)
  worker:
    build: .
    container_name: phonepe-worker
    command: ['node', 'worker.js']
    environment:
      <<: *api-env
      INSTANCE_ID: worker
      DISABLE_WORKER: 'false'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: phonepe-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiate the replica set on first boot, then report healthy once this
      # node is primary. A replica set (even single-node) is what enables
      # MongoDB multi-document transactions for the ledger.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: phonepe-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  redis-data:
