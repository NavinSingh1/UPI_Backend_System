name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Unit tests need no database at all
      - name: Unit tests
        run: npm run test:unit

      # Integration tests need Mongo as a replica set so transactions work
      - name: Start MongoDB (single-node replica set)
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/phonepe-test?replicaSet=rs0
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: ci_test_secret
          NODE_ENV: test

      - name: Verify ledger reconciles
        run: npm run reconcile
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/phonepe-test?replicaSet=rs0
          JWT_SECRET: ci_test_secret
